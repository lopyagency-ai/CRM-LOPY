<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lopy CRM</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body { background:#050505; color:white; font-family:Inter; }
.glass { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(10px);}
</style>
</head>

<body class="p-6">

<div class="max-w-6xl mx-auto">

<h1 class="text-4xl font-bold text-green-500 mb-6">Lopy CRM</h1>

<!-- FORMULÁRIO -->
<div class="glass p-6 rounded-2xl mb-8">

<h2 class="text-xl text-green-400 mb-4">Cold Call Form</h2>

<input id="empresa" placeholder="Empresa" class="w-full p-3 bg-black border mb-3 rounded">
<input id="nome" placeholder="Nome do contato" class="w-full p-3 bg-black border mb-3 rounded">

<select id="perfil" class="w-full p-3 bg-black border mb-3 rounded">
<option>Dono</option>
<option>Comercial</option>
<option>Secretária</option>
</select>

<select id="gargalo" class="w-full p-3 bg-black border mb-3 rounded">
<option>Captação</option>
<option>Conversão</option>
<option>Posicionamento</option>
</select>

<textarea id="resumo" placeholder="Resumo da call" class="w-full p-3 bg-black border mb-3 rounded"></textarea>

<button onclick="salvarLead()" class="bg-green-500 text-black px-6 py-3 rounded-xl w-full font-bold">
Salvar no CRM
</button>

</div>

<!-- DASHBOARD -->
<div class="glass p-6 rounded-2xl">

<h2 class="text-xl text-green-400 mb-4">Leads salvos</h2>

<div id="leads" class="space-y-3"></div>

</div>

</div>

<script>

const supabaseUrl = "https://mrymtjwvgpuihfdxzjtd.supabase.co";
const supabaseKey = "sb_publishable_YaRMCwCa9JGhz3FlWP-P4Q_cwI9GgNO";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// SALVAR LEAD
async function salvarLead(){

  const lead = {
    empresa: document.getElementById("empresa").value,
    nome_contato: document.getElementById("nome").value,
    perfil: document.getElementById("perfil").value,
    gargalo: document.getElementById("gargalo").value,
    resumo: document.getElementById("resumo").value,
    status: "Novo",
    responsavel: "Lopy"
  };

  const { error } = await supabase
    .from("leads")
    .insert([lead]);

  if(error){
    alert("Erro ao salvar");
    console.log(error);
  } else {
    alert("Lead salvo!");
    carregarLeads();
  }
}

// CARREGAR LEADS
async function carregarLeads(){

  const { data } = await supabase
    .from("leads")
    .select("*")
    .order("created_at", { ascending:false });

  const container = document.getElementById("leads");
  container.innerHTML = "";

  data.forEach(l => {

    const div = document.createElement("div");
    div.className = "glass p-4 rounded-xl";

    div.innerHTML = `
      <div class="font-bold text-green-400">${l.empresa}</div>
      <div class="text-sm text-zinc-400">${l.nome_contato}</div>
      <div class="text-xs mt-2">${l.gargalo} • ${l.perfil}</div>
      <div class="text-xs text-zinc-500 mt-2">${l.resumo}</div>
    `;

    container.appendChild(div);
  });

}

carregarLeads();

</script>

</body>
</html>
